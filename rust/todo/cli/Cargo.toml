[package]
name = "todo-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.28.0"
crossterm = "0.28.1"
tokio = { version = "1.42.0", features = ["full"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.42.0", features = ["full"] }
axum = ">=0.7.9"
