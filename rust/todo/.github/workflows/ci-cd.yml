name: CI/CD Pipeline (Docker & Cargo)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # JOB 1: Continuous Integration (Test & Lint)
  # ==========================================
  test-and-check:
    name: 🧪 Run Tests & Cargo Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/todo

      - name: Cargo Check
        run: cargo check --manifest-path rust/todo/Cargo.toml

      - name: Run Unit & Integration Tests
        run: cargo test --manifest-path rust/todo/Cargo.toml --all-targets --all-features

  # ==========================================
  # JOB 2: Docker Build & Security Verification
  # ==========================================
  docker-build:
    name: 🐳 Docker Build & Health Check
    needs: test-and-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: rust/todo
          file: rust/todo/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker Container Execution
        run: |
          docker compose -f rust/todo/docker-compose.yml build app
          docker compose -f rust/todo/docker-compose.yml up -d app
          sleep 5
          docker compose -f rust/todo/docker-compose.yml exec -T app curl -f http://localhost:8080/api/healthcheck
          docker compose -f rust/todo/docker-compose.yml down
